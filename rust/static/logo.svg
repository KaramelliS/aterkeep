<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a15"/>
      <stop offset="1" stop-color="#0a100c"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- arka plan -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="#1f2e26" stroke-width="3"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>

  <!-- zemin gölgesi -->
  <ellipse cx="128" cy="212" rx="72" ry="10" fill="#000" opacity="0.45"/>

  <!-- izometrik kube -->
  <g stroke="#0a0f0b" stroke-width="4" stroke-linejoin="round">
    <!-- sol yuz -->
    <polygon points="60,114 128,158 128,214 60,170" fill="#0e7a36"/>
    <!-- sag yuz -->
    <polygon points="196,114 128,158 128,214 196,170" fill="#0b5c2a"/>
    <!-- ust yuz -->
    <polygon points="128,70 196,114 128,158 60,114" fill="url(#top)"/>
  </g>

  <!-- terminal prompt: >_ -->
  <text x="128" y="132" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="700" fill="#052e16">>_</text>

  <!-- sag alt kucuk durum noktasi (canli) -->
  <circle cx="186" cy="196" r="9" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
