name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Varsayilan izin: yalnizca okuma. Release isi kendi icinde contents: write
# istiyor; geri kalan her adim (ve cektikleri ucuncu taraf action'lar) yazma
# yetkisi gormemeli.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: aterkeep.exe
            artifact: aterkeep-windows
          - os: ubuntu-latest
            binary: aterkeep
            artifact: aterkeep-linux
          - os: macos-latest
            binary: aterkeep
            artifact: aterkeep-macos
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup default stable
      # aterkeep-core PRIVATE repo'dan git dependency çekiyor.
      # ATERKEEP_CORE_TOKEN: aterkeep-core icin SALT OKUNUR fine-grained PAT
      # olmali. Klasik "repo" kapsamli bir token bu hesabin TUM depolarina
      # yazma yetkisi verir ve is boyunca her adima gorunur.
      # x-access-token formatı GitHub PAT için doğru; tüm platformlarda (Windows
      # credential helper çakışması olmadan) çalışır.
      # Fork'lardan gelen PR'lar secret goremez; bu adimi kosullamazsak her fork
      # PR'i anlasilmaz bir hatayla patlar. Fork'ta derleme atlanir.
      - name: Configure private crate access
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        run: git config --global url."https://x-access-token:${{ secrets.ATERKEEP_CORE_TOKEN }}@github.com/KaramelliS/aterkeep-core.git".insteadOf https://github.com/KaramelliS/aterkeep-core.git
      - name: Build release
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        run: cargo build --release --manifest-path rust/Cargo.toml
      # Kimlik bilgisini sonraki adimlardan (ve onlarin cektigi action'lardan) kaldir.
      - name: Revoke private crate credential
        if: always()
        run: git config --global --unset-all url."https://x-access-token:${{ secrets.ATERKEEP_CORE_TOKEN }}@github.com/KaramelliS/aterkeep-core.git".insteadOf || true
      - name: Upload artifact
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' 
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: aterkeep.exe
            asset: aterkeep-windows.exe
          - os: ubuntu-latest
            binary: aterkeep
            asset: aterkeep-linux-amd64
          - os: macos-latest
            binary: aterkeep
            asset: aterkeep-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup default stable
      - name: Configure private crate access
        run: git config --global url."https://x-access-token:${{ secrets.ATERKEEP_CORE_TOKEN }}@github.com/KaramelliS/aterkeep-core.git".insteadOf https://github.com/KaramelliS/aterkeep-core.git
      - name: Build release
        run: cargo build --release --manifest-path rust/Cargo.toml
      # Yayin adimlari ucuncu taraf action'lar; PAT'i onlardan once dusur.
      - name: Revoke private crate credential
        run: git config --global --unset-all url."https://x-access-token:${{ secrets.ATERKEEP_CORE_TOKEN }}@github.com/KaramelliS/aterkeep-core.git".insteadOf || true
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary }} dist/${{ matrix.asset }}
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
      # Binary tek basina yetmiyor: anti-idle bot bot/index.js'e, acilista
      # baslatma scripts/'e ihtiyac duyar. Bunlar olmadan alici depoyu klonlamak
      # zorunda kalir — satilan bir urunde bu kabul edilemez. Tek arsiv,
      # yalnizca bir kez (matrix'in bir kolundan) yuklenir.
      - name: Package companion files
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          zip -r dist/aterkeep-extras.zip \
            bot scripts docs README.md README.tr.md LICENSE config/bot.example.json \
            -x 'bot/node_modules/*' 'bot/*.log'
      - name: Upload companion archive
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aterkeep-extras.zip
    # NOTE: Android/Termux (aarch64-linux-android) binary users build locally:
    #   pkg install rust && cargo build --release --target aarch64-linux-android
    # See docs/TERMUX.md. CI cross-compile skipped (NDK complexity).
